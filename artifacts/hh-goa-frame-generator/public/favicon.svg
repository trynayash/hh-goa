<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4d2b" />
      <stop offset="50%" stop-color="#076b3b" />
      <stop offset="100%" stop-color="#053b20" />
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sun-glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffe400" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#f7087d" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#076b3b" stop-opacity="0" />
    </radialGradient>

    <!-- Vibrant Gold & Pink Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c8" />
      <stop offset="40%" stop-color="#ffe400" />
      <stop offset="100%" stop-color="#f7aa00" />
    </linearGradient>

    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff60b0" />
      <stop offset="100%" stop-color="#f7087d" />
    </linearGradient>

    <!-- Shadow & Glow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect width="512" height="512" rx="120" fill="url(#sun-glow)" />

  <!-- Outer Subtle Gold Rim -->
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Tropical Sun Backdrop -->
  <circle cx="256" cy="200" r="115" fill="url(#gold-grad)" opacity="0.95" filter="url(#shadow)" />

  <!-- Palm Palm Leaf Silhouette in Sun -->
  <path d="M 256 95 C 235 130, 205 160, 165 180 C 210 185, 238 200, 256 240 C 274 200, 302 185, 347 180 C 307 160, 277 130, 256 95 Z" fill="#076b3b" opacity="0.3" />

  <!-- HH Stylized Monogram Logo -->
  <g filter="url(#shadow)">
    <!-- First 'H' (White Gold Accent) -->
    <path d="M 135 130 H 175 V 205 H 220 V 130 H 260 V 290 H 220 V 240 H 175 V 290 H 135 Z" fill="#ffffff" />
    <!-- Second 'H' (Golden Yellow) -->
    <path d="M 252 130 H 292 V 205 H 337 V 130 H 377 V 290 H 337 V 240 H 292 V 290 H 252 Z" fill="url(#gold-grad)" />
    <!-- Pink Gradient Accent Bar -->
    <rect x="210" y="208" width="92" height="34" rx="8" fill="url(#pink-grad)" />
  </g>

  <!-- "GOA 2026" Badge -->
  <g filter="url(#shadow)">
    <rect x="116" y="335" width="280" height="72" rx="36" fill="#092817" stroke="url(#gold-grad)" stroke-width="4" />
    <text x="256" y="384" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="6">GOA 2026</text>
    <circle cx="148" cy="371" r="7" fill="url(#pink-grad)" />
    <circle cx="364" cy="371" r="7" fill="url(#gold-grad)" />
  </g>
</svg>
